<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">Circus task architecture</title>
  <desc id="desc">A Paseo client connects to a Node daemon, a stdio bridge, and the Agent runner. The runner uses the sandbox lifecycle and Docker plus runc to start Codex. Model requests travel from the network-disabled container to a host controller over the process standard streams, then to an approved HTTPS Responses endpoint. Containerd and Kubernetes are library backends, not Agent runner backends.</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M 32 0 H 0 V 32" fill="none" stroke="#1e293b" stroke-width=".65"/></pattern>
    <marker id="arrow" viewBox="0 0 9 9" refX="7" refY="4.5" markerWidth="9" markerHeight="9" orient="auto"><path d="M 1 1 L 8 4.5 L 1 8" fill="none" stroke="#67e8f9" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="arrow-rose" viewBox="0 0 9 9" refX="7" refY="4.5" markerWidth="9" markerHeight="9" orient="auto"><path d="M 1 1 L 8 4.5 L 1 8" fill="none" stroke="#fb7185" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>
  <rect width="1200" height="900" fill="#020617"/>
  <rect width="1200" height="900" fill="url(#grid)"/>
  <rect x="40" y="39" width="8" height="8" rx="4" fill="#34d399"/>
  <text x="60" y="47" fill="#67e8f9" font-family="monospace" font-size="14" font-weight="700">CIRCUS / TASK EXECUTION</text>
  <text x="40" y="95" fill="#f8fafc" font-family="Arial, sans-serif" font-size="34" font-weight="700">One task. One sandbox. A result you can inspect.</text>
  <text x="40" y="125" fill="#94a3b8" font-family="Arial, sans-serif" font-size="17">Current Agent path · Docker + runc · explicit input and artifacts · confirmed cleanup</text>

  <!-- Boundaries and links are drawn before the components. -->
  <rect x="330" y="155" width="830" height="615" rx="12" fill="#0b1526" stroke="#334155" stroke-width="1.5" stroke-dasharray="8 6"/>
  <rect x="866" y="513" width="270" height="240" rx="11" fill="#1e1423" stroke="#fb7185" stroke-width="1.6" stroke-dasharray="7 5"/>
  <path d="M 280 257 H 360" fill="none" stroke="#67e8f9" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M 580 257 H 620" fill="none" stroke="#67e8f9" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M 840 257 H 880" fill="none" stroke="#67e8f9" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M 1005 304 V 350" fill="none" stroke="#67e8f9" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M 1005 466 V 547" fill="none" stroke="#67e8f9" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M 360 403 H 280" fill="none" stroke="#fb7185" stroke-width="2" stroke-dasharray="6 6" marker-end="url(#arrow-rose)"/>
  <path d="M 880 615 H 812 V 451 H 770" fill="none" stroke="#fb7185" stroke-width="2" stroke-dasharray="6 6" marker-end="url(#arrow-rose)"/>

  <text x="356" y="184" fill="#94a3b8" font-family="monospace" font-size="13" font-weight="700">TRUSTED HOST</text>
  <text x="880" y="537" fill="#fda4af" font-family="monospace" font-size="13" font-weight="700">ISOLATED TASK</text>
  <text x="45" y="194" fill="#94a3b8" font-family="monospace" font-size="13" font-weight="700">CLIENT</text>

  <rect x="40" y="210" width="240" height="94" rx="7" fill="#0f172a"/>
  <rect x="40" y="210" width="240" height="94" rx="7" fill="#083344" fill-opacity=".48" stroke="#22d3ee" stroke-width="1.6"/>
  <text x="59" y="246" fill="#f8fafc" font-family="Arial, sans-serif" font-size="21" font-weight="700">Paseo</text>
  <text x="59" y="275" fill="#a5f3fc" font-family="Arial, sans-serif" font-size="14">Web · Desktop · Mobile</text>

  <rect x="360" y="210" width="220" height="94" rx="7" fill="#0f172a"/>
  <rect x="360" y="210" width="220" height="94" rx="7" fill="#083344" fill-opacity=".4" stroke="#22d3ee" stroke-width="1.6"/>
  <text x="379" y="246" fill="#f8fafc" font-family="Arial, sans-serif" font-size="19" font-weight="700">Node daemon</text>
  <text x="379" y="275" fill="#94a3b8" font-family="Arial, sans-serif" font-size="14">sandbox provider</text>

  <rect x="620" y="210" width="220" height="94" rx="7" fill="#0f172a"/>
  <rect x="620" y="210" width="220" height="94" rx="7" fill="#065f46" fill-opacity=".42" stroke="#34d399" stroke-width="1.6"/>
  <text x="639" y="246" fill="#f8fafc" font-family="Arial, sans-serif" font-size="19" font-weight="700">stdio bridge</text>
  <text x="639" y="275" fill="#94a3b8" font-family="Arial, sans-serif" font-size="14">bounded NDJSON</text>

  <rect x="880" y="210" width="250" height="94" rx="7" fill="#0f172a"/>
  <rect x="880" y="210" width="250" height="94" rx="7" fill="#065f46" fill-opacity=".42" stroke="#34d399" stroke-width="1.6"/>
  <text x="899" y="246" fill="#f8fafc" font-family="Arial, sans-serif" font-size="19" font-weight="700">AgentRunner</text>
  <text x="899" y="275" fill="#94a3b8" font-family="Arial, sans-serif" font-size="14">events · deadline · artifacts</text>

  <rect x="40" y="350" width="240" height="116" rx="7" fill="#0f172a"/>
  <rect x="40" y="350" width="240" height="116" rx="7" fill="#1e293b" fill-opacity=".38" stroke="#94a3b8" stroke-width="1.6"/>
  <text x="59" y="386" fill="#f8fafc" font-family="Arial, sans-serif" font-size="19" font-weight="700">Model service</text>
  <text x="59" y="414" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="14">Approved HTTPS endpoint</text>
  <text x="59" y="440" fill="#94a3b8" font-family="monospace" font-size="12">POST /v1/responses</text>

  <rect x="360" y="350" width="410" height="116" rx="7" fill="#0f172a"/>
  <rect x="360" y="350" width="410" height="116" rx="7" fill="#881337" fill-opacity=".35" stroke="#fb7185" stroke-width="1.6"/>
  <text x="379" y="386" fill="#f8fafc" font-family="Arial, sans-serif" font-size="19" font-weight="700">Host model controller</text>
  <text x="379" y="415" fill="#fda4af" font-family="Arial, sans-serif" font-size="14">Real API key stays here</text>
  <text x="379" y="440" fill="#94a3b8" font-family="Arial, sans-serif" font-size="13">Validates request; streams Responses SSE</text>

  <rect x="880" y="350" width="250" height="116" rx="7" fill="#0f172a"/>
  <rect x="880" y="350" width="250" height="116" rx="7" fill="#065f46" fill-opacity=".42" stroke="#34d399" stroke-width="1.6"/>
  <text x="899" y="386" fill="#f8fafc" font-family="Arial, sans-serif" font-size="19" font-weight="700">circus-sandbox</text>
  <text x="899" y="414" fill="#a7f3d0" font-family="monospace" font-size="13">API → lifecycle → backend</text>
  <text x="899" y="440" fill="#94a3b8" font-family="Arial, sans-serif" font-size="13">Lifecycle owns cleanup</text>

  <rect x="880" y="547" width="250" height="186" rx="7" fill="#0f172a"/>
  <rect x="880" y="547" width="250" height="186" rx="7" fill="#881337" fill-opacity=".13" stroke="#fb7185" stroke-width="1.6"/>
  <text x="899" y="585" fill="#f8fafc" font-family="Arial, sans-serif" font-size="21" font-weight="700">Codex CLI</text>
  <text x="899" y="614" fill="#fda4af" font-family="Arial, sans-serif" font-size="14">Docker + runc · network=none</text>
  <line x1="899" y1="637" x2="1111" y2="637" stroke="#713f4b"/>
  <text x="899" y="662" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="14">/workspace/project</text>
  <text x="899" y="690" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="14">Tools + local model forwarder</text>
  <text x="899" y="713" fill="#94a3b8" font-family="Arial, sans-serif" font-size="12">read-only root · non-root · limits</text>

  <rect x="360" y="526" width="410" height="207" rx="7" fill="#0f172a"/>
  <rect x="360" y="526" width="410" height="207" rx="7" fill="#1e293b" fill-opacity=".38" stroke="#64748b" stroke-width="1.4"/>
  <text x="379" y="560" fill="#f8fafc" font-family="Arial, sans-serif" font-size="18" font-weight="700">Sandbox library, beyond this task path</text>
  <text x="379" y="594" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="15">containerd + runc</text>
  <text x="379" y="624" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="15">Kubernetes workload</text>
  <line x1="379" y1="643" x2="750" y2="643" stroke="#334155"/>
  <text x="379" y="672" fill="#94a3b8" font-family="Arial, sans-serif" font-size="14">Workspace · Git · file snapshots · pool</text>
  <text x="379" y="703" fill="#94a3b8" font-family="Arial, sans-serif" font-size="13">HTTP API: Docker sandbox operations only</text>

  <text x="834" y="526" transform="rotate(-90 834 526)" text-anchor="middle" fill="#fda4af" font-family="monospace" font-size="13">stdio tunnel</text>

  <text x="40" y="520" fill="#94a3b8" font-family="Arial, sans-serif" font-size="15">Only explicitly selected files enter.</text>
  <text x="40" y="548" fill="#94a3b8" font-family="Arial, sans-serif" font-size="15">Exports return as separate bytes.</text>
  <text x="40" y="585" fill="#67e8f9" font-family="monospace" font-size="14">INPUT → RUN → EXPORT</text>
  <text x="40" y="612" fill="#67e8f9" font-family="monospace" font-size="14">→ CONFIRM CLEANUP</text>

  <line x1="40" y1="818" x2="1160" y2="818" stroke="#334155"/>
  <line x1="40" y1="851" x2="83" y2="851" stroke="#67e8f9" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="96" y="856" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="14">Task / control path</text>
  <line x1="340" y1="851" x2="383" y2="851" stroke="#fb7185" stroke-width="2" stroke-dasharray="6 6" marker-end="url(#arrow-rose)"/>
  <text x="398" y="856" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="14">Model request via host</text>
  <text x="915" y="856" fill="#64748b" font-family="monospace" font-size="12">CIRCUS / 2026</text>
</svg>
