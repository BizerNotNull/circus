name: Sandbox quality

# No path filters. A required check that does not run stays pending.
# QA source is analyzed here; secret scanning and dependency review are
# independently delivered in the security baseline.
on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:

# Do not cancel a merge-queue run; a cancelled required check does not pass.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'merge_group' }}

permissions:
  contents: read

jobs:
  quality:
    name: Sandbox quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        # v7.0.1 commit 3d3c42e5aac5ba805825da76410c181273ba90b1
        # git/refs/tags/v7.0.1 type=commit, same SHA; action.yml runs.using=node24.
        # v4 (11d5960a326750d5838078e36cf38b85af677262) is node20 and is not used.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        # v7.1.0 commit 949feb2413d6458794dcd2491c4babbbce0c15c1
        # git/refs/tags/v7.1.0 type=commit, same SHA; action.yml runs.using=node24.
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: circus-sandbox/qa/package-lock.json

      - name: Install QA dependencies
        shell: bash
        run: npm --prefix circus-sandbox/qa ci

      - name: Audit QA dependencies
        shell: bash
        run: npm --prefix circus-sandbox/qa audit --audit-level=low

      - name: Check sandbox docs and sources
        shell: bash
        run: npm --prefix circus-sandbox/qa run check

      - name: Lint sandbox quality workflow
        shell: bash
        run: bash .github/scripts/sandbox-actionlint.sh

  codeql:
    name: CodeQL QA
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: javascript-typescript
          build-mode: none
          config-file: ./.github/codeql/sandbox-qa.yml
          queries: security-extended
      - name: Analyze QA source
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:javascript-typescript/sandbox-qa
